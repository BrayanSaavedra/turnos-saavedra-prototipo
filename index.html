<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda · Turnos Saavedra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar navbar-dark bg-dark sticky-top" id="header"></header>
  <main id="app"></main>
  <nav id="nav" aria-label="Navegación principal"></nav>
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x mb-5 pb-4">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Pantalla 1: Agenda del día
    let fechaActual = UI.param('fecha') || Store.hoy();

    const ESTADOS = {
      pendiente: ['warning', 'Pendiente'],
      en_proceso: ['info', 'En proceso'],
      terminado: ['success', 'Terminado'],
    };

    function dibujar() {
      UI.pantalla('agenda', 'Agenda del día', 'Autolavado Saavedra · Bogotá D.C.');
      const turnos = Store.turnosDelDia(fechaActual).filter(t => t.estado !== 'cancelado');
      const esHoy = fechaActual === Store.hoy();
      const terminados = turnos.filter(t => t.estado === 'terminado').length;

      let html =
        '<div class="d-flex justify-content-between align-items-center mb-3">' +
          '<button class="btn btn-outline-secondary" id="ayer" aria-label="Día anterior">&laquo;</button>' +
          '<div class="text-center"><strong>' + UI.esc(UI.fecha(fechaActual)) + '</strong>' + (esHoy ? '<div class="text-muted small">Hoy</div>' : '') + '</div>' +
          '<button class="btn btn-outline-secondary" id="manana" aria-label="Día siguiente">&raquo;</button>' +
        '</div>' +
        '<div class="row g-2 mb-3">' +
          '<div class="col-6"><div class="card text-center"><div class="card-body py-2"><div class="fs-4 fw-bold">' + turnos.length + '</div><small class="text-muted">Turnos (' + terminados + ' terminados)</small></div></div></div>' +
          '<div class="col-6"><div class="card text-center"><div class="card-body py-2"><div class="fs-4 fw-bold">' + UI.dinero(Store.ingresoDelDia(fechaActual)) + '</div><small class="text-muted">Cobrado en el día</small></div></div></div>' +
        '</div>';

      if (!turnos.length) {
        html += '<div class="alert alert-secondary text-center">No hay turnos para este día.<div class="mt-2"><a class="btn btn-primary" href="nuevo.html?fecha=' + fechaActual + '">Agendar un turno</a></div></div>';
      }

      turnos.forEach(t => {
        const cli = Store.cliente(t.clienteId);
        const ser = Store.servicio(t.servicioId);
        const saldo = Store.saldoDe(t);
        const [color, etiqueta] = ESTADOS[t.estado];
        let acciones = '';
        if (t.estado === 'pendiente') {
          acciones += '<button class="btn btn-sm btn-primary" data-accion="iniciar" data-id="' + t.id + '">Iniciar lavado</button> ';
          acciones += '<button class="btn btn-sm btn-outline-danger" data-accion="cancelar" data-id="' + t.id + '">Cancelar</button> ';
        } else if (t.estado === 'en_proceso') {
          acciones += '<button class="btn btn-sm btn-success" data-accion="terminar" data-id="' + t.id + '">Marcar terminado</button> ';
        }
        if (saldo > 0 && t.estado !== 'pendiente') {
          acciones += '<a class="btn btn-sm btn-outline-primary" href="pagos.html?turno=' + t.id + '">Cobrar ' + UI.dinero(saldo) + '</a>';
        }
        html +=
          '<div class="card mb-2"><div class="card-body">' +
            '<div class="d-flex justify-content-between">' +
              '<div><h5 class="card-title mb-1">' + UI.esc(UI.hora12(t.hora)) + '</h5>' +
                '<div class="fw-bold">' + UI.esc(cli.nombre) + '</div>' +
                '<small class="text-muted">' + UI.esc(cli.placa) + ' · ' + UI.esc(ser.nombre) + '</small></div>' +
              '<div class="text-end"><span class="badge text-bg-' + color + '">' + etiqueta + '</span><br>' +
                (t.estado === 'pendiente'
                  ? '<small class="text-muted">Valor ' + UI.dinero(Store.precioDe(t)) + '</small>'
                  : '<span class="badge text-bg-' + (saldo > 0 ? 'danger' : 'success') + ' mt-1">' + (saldo > 0 ? 'Debe ' + UI.dinero(saldo) : 'Pagado') + '</span>') +
              '</div>' +
            '</div>' +
            (acciones ? '<div class="mt-2">' + acciones + '</div>' : '') +
          '</div></div>';
      });

      html += '<p class="text-center text-muted small mt-4">Prototipo académico con datos de ejemplo · <a href="#" id="reset">Restablecer datos de prueba</a></p>';
      document.getElementById('app').innerHTML = html;
    }

    document.addEventListener('click', e => {
      const b = e.target.closest('button, a');
      if (!b) return;
      if (b.id === 'ayer') { fechaActual = Store.sumarDias(fechaActual, -1); dibujar(); }
      else if (b.id === 'manana') { fechaActual = Store.sumarDias(fechaActual, 1); dibujar(); }
      else if (b.id === 'reset') {
        e.preventDefault();
        if (confirm('¿Restablecer los datos de prueba? Se borrarán los turnos, clientes y pagos que haya creado.')) {
          Store.restablecer(); fechaActual = Store.hoy(); dibujar(); UI.aviso('Datos de prueba restablecidos');
        }
      }
      else if (b.dataset.accion === 'iniciar') { Store.cambiarEstado(b.dataset.id, 'en_proceso'); dibujar(); UI.aviso('Lavado iniciado'); }
      else if (b.dataset.accion === 'terminar') { Store.cambiarEstado(b.dataset.id, 'terminado'); dibujar(); UI.aviso('Servicio terminado'); }
      else if (b.dataset.accion === 'cancelar') {
        if (confirm('¿Cancelar este turno?')) { Store.cambiarEstado(b.dataset.id, 'cancelado'); dibujar(); UI.aviso('Turno cancelado'); }
      }
    });

    dibujar();
    if (UI.param('nuevo')) UI.aviso('Turno agendado');
  </script>
</body>
</html>
