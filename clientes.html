<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes · Turnos Saavedra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar navbar-dark bg-dark sticky-top" id="header"></header>
  <main id="app"></main>
  <nav id="nav" aria-label="Navegación principal"></nav>
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x mb-5 pb-4">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Pantalla 3: Clientes
    UI.pantalla('clientes', 'Clientes', 'Registre y consulte a sus clientes');

    let busqueda = '';

    function dibujar() {
      const q = busqueda.trim().toLowerCase();
      const lista = Store.clientes().filter(c =>
        !q || c.nombre.toLowerCase().includes(q) || c.placa.toLowerCase().includes(q) || c.telefono.includes(q));

      let html =
        '<div class="card mb-3"><div class="card-header fw-bold">Nuevo cliente</div><div class="card-body">' +
          '<div class="mb-3"><label for="nombre" class="form-label">Nombre completo</label><input type="text" id="nombre" class="form-control" autocomplete="off"></div>' +
          '<div class="mb-3"><label for="telefono" class="form-label">Celular</label><input type="tel" id="telefono" class="form-control" inputmode="numeric" maxlength="10" placeholder="3001234567"></div>' +
          '<div class="mb-3"><label for="placa" class="form-label">Placa del vehículo</label><input type="text" id="placa" class="form-control" maxlength="6" placeholder="ABC123" autocapitalize="characters"></div>' +
          '<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="autoriza"><label class="form-check-label" for="autoriza">El cliente autoriza el tratamiento de sus datos personales (Ley 1581 de 2012).</label></div>' +
          '<div id="error" class="text-danger fw-bold mb-2" role="alert"></div>' +
          '<button class="btn btn-primary w-100" id="guardar">Guardar cliente</button>' +
        '</div></div>' +
        '<div class="mb-3"><label for="buscar" class="form-label fw-bold">Buscar cliente</label><input type="search" id="buscar" class="form-control" placeholder="Nombre, placa o celular" value="' + UI.esc(busqueda) + '"></div>';

      if (!lista.length) html += '<div class="alert alert-secondary text-center">No se encontraron clientes.</div>';
      html += '<ul class="list-group">';
      lista.forEach(c => {
        html +=
          '<li class="list-group-item d-flex justify-content-between align-items-center">' +
            '<div><div class="fw-bold">' + UI.esc(c.nombre) + '</div><small class="text-muted">' + UI.esc(c.telefono) + '</small></div>' +
            '<div class="text-end"><span class="badge text-bg-secondary">' + UI.esc(c.placa) + '</span><br>' +
            '<a class="btn btn-sm btn-outline-primary mt-1" href="nuevo.html?cliente=' + c.id + '">Agendar</a></div>' +
          '</li>';
      });
      html += '</ul>';
      document.getElementById('app').innerHTML = html;
    }

    document.addEventListener('input', e => {
      if (e.target.id === 'buscar') {
        busqueda = e.target.value;
        const pos = e.target.selectionStart;
        dibujar();
        const campo = document.getElementById('buscar');
        campo.focus(); campo.setSelectionRange(pos, pos);
      }
    });

    document.addEventListener('click', e => {
      if (e.target.id !== 'guardar') return;
      const r = Store.agregarCliente({
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value,
        placa: document.getElementById('placa').value,
        autoriza: document.getElementById('autoriza').checked,
      });
      if (!r.ok) {
        document.getElementById('error').textContent = r.error;
        UI.aviso(r.error, 'error');
        return;
      }
      busqueda = '';
      dibujar();
      UI.aviso('Cliente guardado: ' + r.cliente.nombre);
    });

    dibujar();
  </script>
</body>
</html>
