<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresos · Turnos Saavedra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar navbar-dark bg-dark sticky-top" id="header"></header>
  <main id="app"></main>
  <nav id="nav" aria-label="Navegación principal"></nav>
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x mb-5 pb-4">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Pantalla 5: Resumen de ingresos (día, semana y mes)
    UI.pantalla('ingresos', 'Ingresos', 'Sin sumar a mano: el sistema lleva la cuenta');

    const PERIODOS = {
      dia: { texto: 'Día', dias: 1, titulo: 'Hoy' },
      semana: { texto: 'Semana', dias: 7, titulo: 'Últimos 7 días' },
      mes: { texto: 'Mes', dias: 30, titulo: 'Últimos 30 días' },
    };
    let periodo = 'dia';

    function dibujar() {
      const p = PERIODOS[periodo];
      const hasta = Store.hoy();
      const desde = Store.sumarDias(hasta, -(p.dias - 1));
      const r = Store.ingresos(desde, hasta);

      let html = '<ul class="nav nav-tabs nav-fill mb-3" role="tablist">' +
        Object.entries(PERIODOS).map(([clave, v]) =>
          '<li class="nav-item"><button role="tab" class="nav-link' + (clave === periodo ? ' active' : '') + '" data-periodo="' + clave + '" aria-selected="' + (clave === periodo) + '">' + v.texto + '</button></li>').join('') +
        '</ul>';

      html += '<div class="card border-primary mb-3"><div class="card-body">' +
        '<div class="text-muted small">' + p.titulo + (p.dias > 1 ? ' (' + UI.fechaCorta(desde) + ' – ' + UI.fechaCorta(hasta) + ')' : '') + '</div>' +
        '<div class="display-6 fw-bold">' + UI.dinero(r.total) + '</div><div class="text-muted">Total cobrado</div></div></div>';

      html += '<div class="row g-2 mb-3">' +
        '<div class="col-6"><div class="card text-center"><div class="card-body py-2"><div class="fs-4 fw-bold">' + r.servicios + '</div><small class="text-muted">Servicios terminados</small></div></div></div>' +
        '<div class="col-6"><div class="card text-center"><div class="card-body py-2"><div class="fs-4 fw-bold">' + UI.dinero(r.porCobrar) + '</div><small class="text-muted">Por cobrar</small></div></div></div>' +
        '</div>';

      const pctEf = r.total ? Math.round(r.efectivo * 100 / r.total) : 0;
      html += '<div class="card mb-3"><div class="card-body"><h6 class="card-title">Medio de pago</h6>' +
        '<div class="progress-stacked mb-2" aria-hidden="true">' +
          '<div class="progress" style="width:' + pctEf + '%"><div class="progress-bar"></div></div>' +
          '<div class="progress" style="width:' + (r.total ? 100 - pctEf : 0) + '%"><div class="progress-bar bg-warning"></div></div>' +
        '</div>' +
        '<div class="d-flex justify-content-between small"><span><span class="badge text-bg-primary">&nbsp;</span> Efectivo ' + UI.dinero(r.efectivo) + '</span>' +
        '<span><span class="badge text-bg-warning">&nbsp;</span> Transferencia ' + UI.dinero(r.transferencia) + '</span></div></div></div>';

      if (p.dias > 1) {
        const dias = [];
        for (let i = p.dias - 1; i >= 0; i--) { const f = Store.sumarDias(hasta, -i); dias.push({ f, v: Store.ingresoDelDia(f) }); }
        const max = Math.max(1, ...dias.map(d => d.v));
        html += '<div class="card mb-3"><div class="card-body"><h6 class="card-title">Cobrado por día</h6><div class="barras" role="img" aria-label="Gráfico de ingresos por día">' +
          dias.map(d => '<div class="barra' + (d.f === hasta ? ' hoy' : '') + '" title="' + UI.esc(UI.fechaCorta(d.f)) + ': ' + UI.dinero(d.v) + '"><div class="columna" style="height:' + Math.round(d.v * 100 / max) + '%"></div></div>').join('') +
          '</div><div class="etiquetas">' +
          dias.map((d, i) => '<span>' + (p.dias <= 7 || i % 5 === 0 || d.f === hasta ? Number(d.f.slice(8)) : '') + '</span>').join('') +
          '</div><div class="form-text">La barra naranja es hoy.</div></div></div>';
      }
      document.getElementById('app').innerHTML = html;
    }

    document.addEventListener('click', e => {
      const b = e.target.closest('button[data-periodo]');
      if (b) { periodo = b.dataset.periodo; dibujar(); }
    });
    dibujar();
  </script>
</body>
</html>
